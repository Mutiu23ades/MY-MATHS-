name: Build SSS 1 Mathematics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build SSS 1 Mathematics APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check project files
        run: |
          echo "Files in repository:"
          ls -la

      - name: Create web directory
        run: |
          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            echo "ERROR: index.html was not found in repository root."
            exit 1
          fi

          if [ -f style.css ]; then
            cp style.css www/style.css
          fi

          if [ -f script.js ]; then
            cp script.js www/script.js
          fi

          echo "Web files:"
          ls -la www

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "sss1-mathematics",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sss1mathematics.app",
            "appName": "SSS 1 Mathematics App",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android

      - name: Copy web app to Android
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-1-Mathematics-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
