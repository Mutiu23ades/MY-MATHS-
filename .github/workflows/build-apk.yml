name: Build SSS 1 Mathematics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create web directory
        run: |
          mkdir -p www
          cp ./index.html ./www/index.html
          echo "Web directory created successfully"
          ls -la www

      - name: Create package.json
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sss1mathematics.app",
            "appName": "SSS 1 Mathematics App",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Set Android app name
        run: |
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">SSS 1 Mathematics App</string>#' android/app/src/main/res/values/strings.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-1-Mathematics-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
