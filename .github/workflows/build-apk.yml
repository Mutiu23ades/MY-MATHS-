name: Build SSS 1 Mathematics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sss1mathematics.app",
            "appName": "SSS 1 Mathematics App",
            "webDir": "."
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             apk/SSS-1-Mathematics-App.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-1-Mathematics-App
          path: apk/SSS-1-Mathematics-App.apk
